<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ensures YouTube gets proper referrer information -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Random YouTube Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .player-container {
            width: 80%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 28px;
            font-size: 18px;
            color: #fff;
            background-color: #ff0000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>

<body>

    <h1>🎲 Random YouTube Player</h1>

    <div style="text-align: center; background: #121212; color: white; padding: 20px; font-family: sans-serif;">
        <h2>Random YouTube Player Test</h2>
        <div style="position: relative; width: 100%; max-width: 640px; margin: 0 auto; aspect-ratio: 16/9;">
            <iframe id="player" style="width:100%; height:100%; border:none;" allow="autoplay; encrypted-media"
                allowfullscreen></iframe>
        </div>
        <br>
        <button onclick="changeVideo()"
            style="padding: 10px 20px; background: red; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">Next
            Video</button>
    </div>

    <script>
        // A verified list of videos that allow embedding anywhere
        const videos = ["jfKfPfyJRdk", "9bZkp7q19f0", "8jLoV1WhhZs"];

        function changeVideo() {
            const randomVid = videos[Math.floor(Math.random() * videos.length)];
            document.getElementById("player").src = `https://www.youtube-nocookie.com/embed/${randomVid}?autoplay=1`;
        }

        // Load first video immediately
        changeVideo();
    </script>

</body>

</html>
